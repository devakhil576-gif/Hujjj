<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131d">
<title>Pet Haven — Virtual Pet</title>
<style>
:root{--bg:#100e15;--panel:#191620;--panel2:#211c2b;--text:#f7f2ff;--muted:#aaa0b7;--accent:#c9a7ff;--good:#7ee2a8;--warn:#ffd27d;--bad:#ff8f9d;--line:#342c40}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#342343 0,#100e15 48%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input{font:inherit}button{border:0;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;transition:.16s transform,.16s background}button:active{transform:scale(.96)}button:hover{background:#2b2437}.app{max-width:1050px;margin:auto;padding:18px 14px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.brand h1{font-size:22px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.card{background:rgba(25,22,32,.9);border:1px solid var(--line);border-radius:22px;box-shadow:0 16px 50px #0005;overflow:hidden}.room{position:relative;min-height:570px;background:linear-gradient(#403b50 0 62%,#6b5260 62%);overflow:hidden}.room:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 78% 17%,#fff5 0 5%,transparent 6%),linear-gradient(90deg,transparent 70%,#211b29 70%);opacity:.5}.window{position:absolute;right:6%;top:9%;width:25%;height:28%;border:9px solid #27202f;border-radius:10px;background:linear-gradient(#8bb8d1,#e9c7a8);box-shadow:inset 0 0 0 3px #d9c2a2}.plant{position:absolute;left:6%;bottom:18%;font-size:70px;filter:drop-shadow(0 8px 5px #0005)}.rug{position:absolute;left:20%;right:20%;bottom:7%;height:25%;border-radius:50%;background:#453346;box-shadow:inset 0 0 0 5px #5b4051}.pet-wrap{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3}.pet{font-size:145px;line-height:1;filter:drop-shadow(0 16px 9px #0007);animation:breathe 2.8s ease-in-out infinite;user-select:none}.pet.happy{animation:hop .55s ease}.pet.sleep{animation:sleep 3s ease-in-out infinite;filter:drop-shadow(0 10px 7px #0005) grayscale(.15)}.pet.eat{animation:eat .7s ease}.bubble{background:#fff;color:#211c2b;padding:9px 13px;border-radius:18px;max-width:230px;text-align:center;margin-bottom:9px;box-shadow:0 8px 20px #0003;opacity:0;transform:translateY(7px);transition:.25s}.bubble.show{opacity:1;transform:none}.room-label{position:absolute;left:15px;top:15px;padding:7px 10px;border-radius:10px;background:#15111caa;color:#eee;font-size:12px;z-index:4}.actions{position:absolute;bottom:15px;left:15px;right:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;z-index:5}.action{background:#17131ddd;backdrop-filter:blur(8px)}.action b{display:block;font-size:18px}.action small{color:var(--muted)}.side{padding:14px}.stats{display:grid;gap:10px}.stat{background:#15121b;border:1px solid var(--line);border-radius:15px;padding:11px}.stat-head{display:flex;justify-content:space-between;margin-bottom:7px}.stat-head span:last-child{color:var(--muted);font-size:12px}.bar{height:8px;background:#302936;border-radius:99px;overflow:hidden}.fill{height:100%;width:50%;border-radius:99px;background:var(--good);transition:width .35s}.section{margin-top:14px}.section h2{font-size:13px;color:#dcd2e5;margin:0 0 8px}.food,.toys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{padding:10px 5px;text-align:center}.mini span{font-size:24px;display:block}.mini small{color:var(--muted)}.chat{display:flex;flex-direction:column;height:300px}.messages{flex:1;overflow:auto;padding:10px;background:#121017;border-radius:15px;margin-bottom:8px;border:1px solid var(--line)}.msg{max-width:88%;padding:8px 10px;border-radius:12px;margin:5px 0;line-height:1.35}.petmsg{background:#292334}.usermsg{background:#4b3a61;margin-left:auto}.chatbar{display:flex;gap:7px}.chatbar input{flex:1;background:#121017;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px;outline:none}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);opacity:0;background:#eee;color:#17131d;padding:10px 14px;border-radius:12px;box-shadow:0 8px 25px #0006;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@keyframes breathe{50%{transform:translateY(-5px) scale(1.015)}}@keyframes hop{50%{transform:translateY(-35px) rotate(-4deg)}100%{transform:none}}@keyframes sleep{50%{transform:translateY(4px) rotate(2deg);opacity:.8}}@keyframes eat{35%{transform:scale(.92) translateY(5px)}70%{transform:scale(1.06)}}@media(max-width:760px){.grid{grid-template-columns:1fr}.room{min-height:510px}.pet{font-size:125px}.actions{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.side{padding-top:0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><h1>Pet Haven</h1><p>Your tiny companion remembers you on this device.</p></div><button id="reset">Reset pet</button></header>
<main class="grid">
<section class="card room">
<div class="room-label" id="roomLabel">Living room</div><div class="window"></div><div class="plant">🪴</div><div class="rug"></div>
<div class="pet-wrap"><div class="bubble" id="bubble"></div><div class="pet" id="pet">🐶</div></div>
<div class="actions"><button class="action" onclick="feed('🍎',12,2,2,4)"><b>🍎</b><small>Feed</small></button><button class="action" onclick="play('🎾',4,14,6,8)"><b>🎾</b><small>Play</small></button><button class="action" onclick="petPet()"><b>🤗</b><small>Affection</small></button><button class="action" onclick="sleepPet()"><b>💤</b><small>Sleep</small></button></div>
</section>
<aside class="card side">
<div class="stats"><div class="stat"><div class="stat-head"><b>🍖 Hunger</b><span id="hungerV">80</span></div><div class="bar"><div class="fill" id="hunger"></div></div></div><div class="stat"><div class="stat-head"><b>😊 Happiness</b><span id="happyV">75</span></div><div class="bar"><div class="fill" id="happy"></div></div></div><div class="stat"><div class="stat-head"><b>⚡ Energy</b><span id="energyV">80</span></div><div class="bar"><div class="fill" id="energy"></div></div></div><div class="stat"><div class="stat-head"><b>❤️ Affection</b><span id="affectionV">65</span></div><div class="bar"><div class="fill" id="affection"></div></div></div></div>
<div class="section"><h2>FOOD</h2><div class="food"><button class="mini" onclick="feed('🍎',12,2,2,4)"><span>🍎</span><small>Apple</small></button><button class="mini" onclick="feed('🍖',20,4,1,6)"><span>🍖</span><small>Meal</small></button><button class="mini" onclick="feed('🍪',8,8,-2,3)"><span>🍪</span><small>Treat</small></button></div></div>
<div class="section"><h2>TOYS</h2><div class="toys"><button class="mini" onclick="play('🧸',3,12,5,7)"><span>🧸</span><small>Teddy</small></button><button class="mini" onclick="play('🪀',2,10,5,6)"><span>🪀</span><small>Yo-yo</small></button><button class="mini" onclick="play('⚽',1,15,7,8)"><span>⚽</span><small>Ball</small></button></div></div>
<div class="section chat"><h2>CHAT WITH YOUR PET</h2><div class="messages" id="messages"></div><div class="chatbar"><input id="chatInput" placeholder="Say something…" maxlength="120"><button onclick="sendChat()">Send</button></div></div>
</aside></main></div><div class="toast" id="toast"></div>
<script>
const KEY='pet-haven-v1';
const fresh={hunger:80,happy:75,energy:80,affection:65,last:Date.now(),name:'Milo',sleeping:false};
let state=JSON.parse(localStorage.getItem(KEY)||'null')||fresh;
const $=id=>document.getElementById(id);const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
function save(){state.last=Date.now();localStorage.setItem(KEY,JSON.stringify(state));render()}
function applyOffline(){let mins=Math.min(720,(Date.now()-state.last)/60000);if(mins<1)return;state.hunger=clamp(state.hunger-mins*.7);state.happy=clamp(state.happy-mins*.35);state.energy=clamp(state.energy+(state.sleeping?mins*.8:-mins*.25));state.affection=clamp(state.affection-mins*.12);state.sleeping=false}
function render(){for(const k of ['hunger','happy','energy','affection']){$(k+'V').textContent=state[k];$(k).style.width=state[k]+'%'}$('pet').className='pet'+(state.sleeping?' sleep':'')}
function actionClass(c){$('pet').className='pet '+c;setTimeout(render,700)}
function say(t){$('bubble').textContent=t;$('bubble').classList.add('show');clearTimeout(window.bt);window.bt=setTimeout(()=>$('bubble').classList.remove('show'),2800)}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.remove('show'),1800)}
function feed(icon,h,hap,e,a){state.hunger=clamp(state.hunger+h);state.happy=clamp(state.happy+hap);state.energy=clamp(state.energy+e);state.affection=clamp(state.affection+a);state.sleeping=false;actionClass('eat');say(icon+' Yum! Thank you!');toast('Fed '+state.name);save()}
function play(icon,hap,e,a){if(state.energy<8){say('I am too tired to play… 💤');return}state.hunger=clamp(state.hunger-3);state.happy=clamp(state.happy+hap);state.energy=clamp(state.energy-e);state.affection=clamp(state.affection+a);state.sleeping=false;actionClass('happy');say(icon+' That was fun!');save()}
function petPet(){state.affection=clamp(state.affection+12);state.happy=clamp(state.happy+5);state.energy=clamp(state.energy-1);actionClass('happy');say('I love you! ❤️');save()}
function sleepPet(){state.sleeping=!state.sleeping;if(state.sleeping){say('Good night… zzz 💤');$('roomLabel').textContent='Bedroom mode'}else{say('I feel refreshed! ☀️');$('roomLabel').textContent='Living room'}save()}
function addMsg(text,who){const d=document.createElement('div');d.className='msg '+(who==='user'?'usermsg':'petmsg');d.textContent=text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function reply(text){const t=text.toLowerCase();let r=t.includes('hello')||t.includes('hi')?'Hi! I was waiting for you! 🐾':t.includes('love')?'I love spending time with you. ❤️':t.includes('sad')?'Come here. We can have a quiet moment together.':t.includes('hungry')?'Actually… a snack sounds amazing. 🍖':t.includes('play')?'YES! Pick a toy! 🎾':t.includes('sleep')?'A cozy nap sounds perfect. 💤':t.includes('good morning')?'Good morning! Let’s make today a good one. ☀️':t.includes('name')?'I am Milo, your little buddy!':t.includes('how are')?`I feel ${state.happy>70?'great':'a little moody'} and my energy is ${state.energy}.`:'I am listening. Tell me more!';addMsg(r,'pet');say(r);state.affection=clamp(state.affection+2);save()}
function sendChat(){const i=$('chatInput'),t=i.value.trim();if(!t)return;addMsg(t,'user');i.value='';setTimeout(()=>reply(t),350)}
$('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});$('reset').onclick=()=>{if(confirm('Start over with a new pet state?')){state={...fresh,last:Date.now()};localStorage.setItem(KEY,JSON.stringify(state));$('messages').innerHTML='';addMsg('I am here! Let’s be friends. 🐾','pet');say('Hello! I am Milo!');render()}};
applyOffline();render();addMsg('Hi! I am Milo. You can feed me, play with me, cuddle me, or just talk.','pet');
setInterval(()=>{if(state.sleeping){state.energy=clamp(state.energy+1);state.hunger=clamp(state.hunger-.15)}else{state.hunger=clamp(state.hunger-.35);state.happy=clamp(state.happy-.12);state.energy=clamp(state.energy-.18)}state.affection=clamp(state.affection-.04);localStorage.setItem(KEY,JSON.stringify({...state,last:Date.now()}));render()},60000);
</script></body></html>
